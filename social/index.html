<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shree Balaji Foods Private Limited</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-color: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .logo-box {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }

    .logo-box img {
      display: block;
      width: 100%;
      max-width: 290px;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.92;
    }

    .btn-facebook {
      background-color: #1877f2;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    }

    .btn-tiktok {
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-box">
      <!-- Upload your logo image to the repository and name it logo.jpg -->
<img src="../logo.JPG" alt="Shree Balaji Foods Pvt. Ltd.">
    </div>

    <h1>Follow &amp; Stay Connected</h1>
    <p class="subtitle">Choose your favorite platform below</p>

    <div class="links">
      <!-- Replace # with your actual profile URLs -->
      <a class="btn btn-facebook" href="https://www.facebook.com/share/19iNeFvUfo/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">
        Facebook
      </a>
      <a class="btn btn-instagram" href="https://www.instagram.com/metrobites.official?utm_source=qr&hvrq=Zm85aHZuaHdxY2V0" target="_blank" rel="noopener noreferrer">
        Instagram
      </a>
      <a class="btn btn-tiktok" href="https://www.tiktok.com/@_metrobites?_r=1&_t=ZS-9BZCCybcmub" target="_blank" rel="noopener noreferrer">
        TikTok
      </a>
    </div>
  </main>
</body>
</html>
