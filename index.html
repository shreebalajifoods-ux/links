<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shree Balaji Foods Pvt. Ltd. — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      padding: 36px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.35);
    }
    .logo-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-box img {
      max-width: 100%;
      max-height: 160px;
      height: auto;
      display: block;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 26px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <img src="logo.JPG" alt="Shree Balaji Foods Pvt. Ltd.">
    </div>
    <h1>Our Website Is Coming Soon</h1>
    <p>We are crafting our official online home. In the meantime, connect with us on our social media channels.</p>
    <a class="btn" href="/social">Connect With Us on Social Media</a>
  </div>
</body>
</html>
