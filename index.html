<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect With Us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      padding: 36px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #9ca3af; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { transform: translateY(-2px); opacity: 0.92; }
    .fb { background: #1877F2; }
    .ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .tt { background: #000000; border: 1px solid #374151; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Follow & Stay Connected</h1>
    <p>Choose your favorite platform below</p>
    <a class="btn fb" href="https://www.facebook.com/share/1A4K7HbNGf/?mibextid=wwXIfr" target="_blank">Facebook</a>
    <a class="btn ig" href="https://www.instagram.com/metrobites.official?jplx=MWJrZmh1MXI0N2x4bg==" target="_blank">Instagram</a>
    <a class="btn tt" href="https://www.tiktok.com/@_metrobites?_r=1&_t=ZS-9BYxwFV11bo"_blank">TikTok</a>
  </div>
</body>
</html>
